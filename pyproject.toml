[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-contradiction-finder"
version = "0.1.0"
description = "Condition-aware discovery and analysis of conflicting scientific findings"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.7.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "respx>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
